name: Release lobehub-ami

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel. The GitHub Environment of the same name provides the registry and reporting configuration.
        required: true
        default: beta
        type: choice
        options:
          - beta
          - production
      version:
        description: Production version (X.Y.Z, optional leading v). Required for production, ignored for beta.
        required: false
        type: string
      changelog_summary:
        description: Optional changelog summary. Defaults to the first non-empty changelog line, then "Release <version>".
        required: false
        type: string
      changelog:
        description: Changelog body. Required for production; optional for beta.
        required: false
        type: string
      requires:
        description: Optional JSON object of product requirements, for example {"lobehub-enterprise":">=2.3.0"}.
        required: false
        type: string

concurrency:
  group: release-lobehub-ami-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  release:
    name: Release lobehub-ami
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: lobehub-enterprise/lobehub-ami-orchestrator/.github/workflows/release-image.yml@main
    with:
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      changelog_summary: ${{ inputs.changelog_summary }}
      changelog: ${{ inputs.changelog }}
      requires: ${{ inputs.requires }}
      product: lobehub-ami
      ecr_repository: lobehub/lobehub-ami
      context: .
      file: Dockerfile
      license: false
    secrets:
      integration_token: ${{ secrets.CLOUD_ADMIN_INTEGRATION_TOKEN }}
